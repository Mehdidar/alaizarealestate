<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry Received | AIZA Real Estate</title>
    <!-- Fonts sync with index.html -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Questrial&display=swap" rel="stylesheet">
    <style>
        :root {
            --highlight: #00f3c0;
            --bg-dark: #070707;
            --text-light: #e0e0e0;
            --font-main: 'Inter', sans-serif;
            --font-headings: 'Questrial', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Sync with main site background */
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(0, 243, 192, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .glow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 243, 192, 0.08) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .thank-you-box {
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 80px 40px;
            border-radius: 2px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            animation: slideIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .success-icon-wrap {
            margin-bottom: 40px;
            position: relative;
            display: inline-block;
        }

        .pulse-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0, 243, 192, 0.1);
            border-radius: 50%;
            animation: pulseSuccess 2s infinite;
        }

        .icon-main {
            width: 80px;
            height: 80px;
            background: var(--bg-dark);
            border: 2px solid var(--highlight);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--highlight);
            position: relative;
            z-index: 2;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 243, 192, 0.1);
            padding: 8px 16px;
            border-radius: 30px;
            margin-bottom: 30px;
        }

        .status-badge span {
            font-size: 10px;
            color: var(--highlight);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-family: var(--font-headings);
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: -2px;
            margin-bottom: 20px;
            /* Clip Text for gradient look */
            background: linear-gradient(to bottom, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 50px;
            font-weight: 300;
        }

        .redirect-timer {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .btn-sleek {
            display: inline-flex;
            align-items: center;
            gap: 20px;
            background: #fff;
            color: #000;
            padding: 20px 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .btn-sleek:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 243, 192, 0.2);
        }

        @keyframes pulseSuccess {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
        }

        @keyframes slideIn {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .thank-you-box { padding: 60px 20px; }
        }
    </style>
</head>
<body>

    <div class="glow-overlay"></div>

    <div class="thank-you-box">
        <div class="success-icon-wrap">
            <div class="pulse-circle"></div>
            <div class="icon-main">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
        </div>

        <div class="status-badge">
            <span>Transmission Successful</span>
        </div>

        <h1>Thank <span style="color:var(--highlight);">You</span></h1>
        
        <p>Your inquiry has been processed through our secure core. <br>
           An Al Aiza specialist will initiate contact within 24 hours.</p>

        <div class="redirect-timer" id="timer">Redirecting to Dashboard in 5s...</div>

        <a href="index.html" class="btn-sleek">
            <span>Return to Portfolio</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 19 12 12 5"/></svg>
        </a>
    </div>

    <script>
        let counter = 5;
        const timerElement = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            counter--;
            timerElement.textContent = `Redirecting to Dashboard in ${counter}s...`;
            if (counter <= 0) {
                clearInterval(countdown);
                window.location.href = "index.html";
            }
        }, 1000);
    </script>
</body>
</html>
